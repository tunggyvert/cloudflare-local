appId: dev.tunggyvert.cloudflare-local
productName: cloudflare-local
directories:
  buildResources: build
files:
  - out/**
  - package.json
# Native modules must not be bundled into the asar — they are loaded at runtime.
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
